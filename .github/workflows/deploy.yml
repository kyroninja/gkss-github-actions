# ============================================================
# .github/workflows/deploy.yml
#
# GitHub Actions Workflow: Build, Test & Deploy Flask Site
#
# WHAT THIS FILE DOES:
#   Every time you push to the `master` branch, GitHub will
#   automatically spin up a virtual machine and run this file
#   top to bottom. It does two things in order:
#     1. Runs your tests — if they fail, nothing deploys
#     2. SSHs into your VPS and pulls + restarts the app
#
# STRUCTURE:
#   on:       → what triggers the workflow
#   jobs:     → the units of work to run
#     build_and_test  → installs deps and runs pytest
#     deploy          → SSHs into the server and deploys
# ============================================================

name: Build and Deploy   # shown in the GitHub Actions UI tab


# --- TRIGGERS ------------------------------------------------
# `on` defines the events that kick off this workflow.
# Here we trigger on two things:
#   1. A push to the master branch
#   2. A manual trigger from the GitHub Actions UI (workflow_dispatch)
on:
  push:
    branches:
      - master          # only run on pushes to master, not other branches
  workflow_dispatch:    # adds a "Run workflow" button in the GitHub UI


# --- JOBS ----------------------------------------------------
# A workflow has one or more jobs. By default jobs run in
# parallel, but we use `needs:` to chain them sequentially.
# Each job gets its own fresh virtual machine from GitHub.
jobs:

  # ---- JOB 1: build_and_test --------------------------------
  # Installs the app and runs the test suite.
  # If ANY test fails, this job fails and `deploy` is blocked.
  build_and_test:
    runs-on: ubuntu-latest    # use GitHub's Ubuntu runner VM

    steps:

      # Checks out your repo code onto the runner VM.
      # Without this step the machine has no access to your files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the specified Python version on the runner.
      # `cache: pip` speeds up repeated runs by caching downloaded packages
      # so they don't need to be re-downloaded if requirements.txt hasn't changed.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # `run` executes shell commands directly on the runner VM.
      # We install everything from requirements.txt plus pytest
      # (pytest is only needed for testing, not production, so it's
      # not in requirements.txt itself).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Runs the test suite. pytest auto-discovers files matching test_*.py.
      # --verbose prints each test name and pass/fail result in the logs.
      # If any test fails here, the deploy job below will not run.
      - name: Run tests
        run: pytest test_app.py --verbose


  # ---- JOB 2: deploy ----------------------------------------
  # SSHs into the VPS and deploys the latest code.
  # Only runs if build_and_test passed AND we're on master.
  deploy:
    runs-on: ubuntu-latest

    # `needs` makes this job wait for build_and_test to finish first.
    # If build_and_test fails, deploy is skipped entirely.
    needs: build_and_test

    # Extra safety check — only deploy when the push was to master.
    # This prevents accidental deploys from other branches if the
    # trigger rules above ever change.
    if: github.ref == 'refs/heads/master'

    steps:

      # Each job runs on a fresh VM so we need to check out the code again.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses the `appleboy/ssh-action` from the GitHub Actions Marketplace.
      # This action handles the SSH connection and runs the script below
      # on your VPS as the configured user.
      #
      # SECRETS — never hardcode sensitive values in this file.
      # All ${{ secrets.* }} values are stored in:
      #   GitHub Repo → Settings → Secrets and variables → Actions
      #
      #   SSH_HOST     → your VPS IP address
      #   SSH_USERNAME → deploy  (the user we set up on the server)
      #   SSH_KEY      → your private SSH key (from BitVise export)
      #   SSH_PORT     → 22
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT }}

          # Everything inside `script` runs ON YOUR VPS over SSH.
          # Commands execute sequentially — `set -e` means the whole
          # script aborts immediately if any single command fails,
          # so a broken deploy won't silently half-finish.
          script: |
            set -e   # abort on any error

            echo "Pulling latest code..."
            cd /var/www/gkss-github-actions
            # `git fetch` downloads the latest commits from GitHub without
            # merging anything yet. Safer than `git pull` in automated contexts.
            git fetch origin master
            # `reset --hard` forces the working directory to exactly match
            # the remote master branch, discarding any local differences.
            git reset --hard origin/master

            echo "Installing/updating Python dependencies..."
            # Activate the virtualenv so pip installs into the right place
            source venv/bin/activate
            # Install/update packages — only does anything if requirements.txt changed
            pip install -r requirements.txt --quiet

            echo "Restarting Gunicorn..."
            # Restart the systemd service that keeps Gunicorn running.
            # The deploy user has passwordless sudo rights for this command
            # via /etc/sudoers.d/deploy-restart on the server.
            sudo systemctl restart gkss-github-actions

            echo "Checking service is running..."
            # Verify the service came back up cleanly after the restart.
            # is-active returns exit code 0 if running, non-zero if not.
            # If it failed, we print the last 20 lines of the systemd journal
            # so the error shows up in the GitHub Actions log.
            sudo systemctl is-active --quiet gkss-github-actions \
              && echo "Service is up" \
              || (echo "Service failed to start" && sudo journalctl -u gkss-github-actions -n 20 && exit 1)

            echo "Deployed successfully!"
