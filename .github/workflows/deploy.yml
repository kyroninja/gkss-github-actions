# ============================================================
# .github/workflows/deploy.yml
# ============================================================

name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest test_app.py --verbose

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "Pulling latest code..."
            cd /var/www/gkss-github-actions
            git fetch origin master
            git reset --hard origin/master

            echo "Installing/updating Python dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            echo "Restarting Gunicorn..."
            sudo systemctl restart gkss-github-actions

            echo "Checking service is running..."
            sudo systemctl is-active --quiet gkss-github-actions \
              && echo "Service is up" \
              || (echo "Service failed to start" && sudo journalctl -u gkss-github-actions -n 20 && exit 1)

            echo "Deployed successfully!"
