<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}webapp.kyro.ninja{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Variables ─────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0c0c0f;
            --surface:   #13131a;
            --border:    #1e1e2e;
            --accent:    #7bffa0;
            --accent-dim:#2a5c3a;
            --text:      #e2e2e8;
            --muted:     #6b6b80;
            --font-head: 'Syne', sans-serif;
            --font-mono: 'DM Mono', monospace;
            --radius:    6px;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ────────────────────────────────────────────── */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(12, 12, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }

        .nav-logo {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .nav-logo span { color: var(--muted); font-weight: 400; }

        .nav-links { display: flex; gap: 0.25rem; }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius);
            font-size: 0.8rem;
            transition: color 0.15s, background 0.15s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
            background: var(--border);
        }

        /* ── Main content ───────────────────────────────────── */
        main {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        /* ── Footer ─────────────────────────────────────────── */
        footer {
            border-top: 1px solid var(--border);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--muted);
        }

        footer a { color: var(--muted); text-decoration: none; }
        footer a:hover { color: var(--accent); }

        /* ── Status dot ─────────────────────────────────────── */
        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ── Shared typography ──────────────────────────────── */
        h1, h2, h3 {
            font-family: var(--font-head);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .tag {
            display: inline-block;
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>

<nav>
    <a href="/" class="nav-logo">kyro<span>.ninja</span></a>
    <div class="nav-links">
        <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>home</a>
        <a href="/about" {% if request.endpoint == 'about' %}class="active"{% endif %}>about</a>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <div class="status">
        <span class="status-dot"></span>
        <span>deployed via github actions</span>
    </div>
    <a href="https://github.com" target="_blank">view source →</a>
</footer>

</body>
</html>
